version: '3.8'

services:
  absensi-app-dev:
    image: node:20-alpine
    container_name: absensi-app-dev
    working_dir: /app
    # Menjalankan instalasi package (jika belum) lalu npm run dev
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - TZ=Asia/Jakarta
      # CHOKIDAR & WATCHPACK diperlukan untuk Podman/Docker agar HMR berjalan lancar
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount folder project host ke dalam container (ini kunci HMR!)
      - ./:/app
      # Hindari menimpa folder build & node_modules host
      - node_modules:/app/node_modules
      - next_build:/app/.next

volumes:
  node_modules:
  next_build:

